# Rilis APK: dipicu tag `vMAJOR.MINOR.PATCH` (mis. v1.0.3). Membangun APK bertanda tangan,
# universal dan per-ABI, lalu menerbitkannya sebagai GitHub Release bersama `version.json`, yang dibaca fitur
# "Pembaruan aplikasi" di dalam aplikasi. Panduan: docs/rilis-dan-pembaruan.md
name: Rilis APK

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write # membuat GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Versi dari tag
        id: ver
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$NAME"
          if [ "$MINOR" -ge 100 ] || [ "$PATCH" -ge 100 ]; then
            echo "MINOR dan PATCH harus < 100 agar versionCode berurutan" >&2; exit 1
          fi
          # versionCode naik monoton mengikuti nomor versi: 1.0.3 -> 10003, 1.2.0 -> 10200.
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Pasang dependensi
        run: flutter pub get

      - name: Analisis dan test
        run: |
          flutter analyze
          flutter test

      - name: Siapkan tanda tangan rilis
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Secret $v belum diisi" >&2; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Bangun APK (universal dan per-ABI)
        env:
          REQUIRE_RELEASE_SIGNING: 'true'
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          NAME: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          if [ -z "$API_BASE_URL" ]; then echo "Variabel repo API_BASE_URL belum diisi" >&2; exit 1; fi
          mkdir -p dist
          OUT=build/app/outputs/flutter-apk
          # Universal: dibaca semua versi aplikasi lewat apk_url (termasuk <= 1.0.4).
          flutter build apk --release \
            --build-name="$NAME" --build-number="$CODE" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          cp "$OUT/app-release.apk" "dist/eabsensi-v$NAME.apk"
          # Per-ABI: sekitar sepertiga ukuran universal. versionCode dipaksa sama dengan
          # universal (tanpa tambahan 1000*ABI) agar perbandingan versi di aplikasi tetap benar.
          flutter build apk --release --split-per-abi \
            -P force-version-code-ignoring-abi=true \
            --build-name="$NAME" --build-number="$CODE" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            SRC="$OUT/app-$ABI-release.apk"
            if [ ! -f "$SRC" ]; then echo "Tidak ada $SRC" >&2; exit 1; fi
            cp "$SRC" "dist/eabsensi-v$NAME-$ABI.apk"
          done

      - name: Periksa versionCode semua APK
        env:
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          for APK in dist/*.apk; do
            GOT="$("$AAPT2" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
            echo "$APK versionCode=$GOT ($(stat -c %s "$APK") byte)"
            if [ "$GOT" != "$CODE" ]; then echo "versionCode $APK = $GOT, seharusnya $CODE" >&2; exit 1; fi
          done

      - name: Susun version.json
        env:
          NAME: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          # actions/checkout menjadikan tag anotasi tag ringan, sehingga %(contents) berisi pesan
          # commit. Ambil ulang objek tag aslinya; tag ringan sungguhan = catatan kosong.
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          : > notes.txt
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag ]; then
            # subject + body (tanpa tanda tangan GPG).
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" > notes.txt
          fi
          dart run tool/release/build_manifest.dart \
            --name "$NAME" --code "$CODE" --tag "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" --dist dist \
            --notes-file notes.txt --out version.json
          cat version.json

      - name: Terbitkan GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            version.json
          make_latest: true
          generate_release_notes: true
